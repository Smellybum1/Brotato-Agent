# WP2 - combat_obs_v1 observation schema, ABSOLUTE-ENTITY-VELOCITY variant.
#
# configs/wp2/observation_v1.yaml is BYTE-FROZEN: load_schema hashes that file
# and every combat_obs_v1 / human_obs_v1 manifest pins the result, so editing it
# (even a comment) makes those datasets unloadable. This is a SIBLING file, the
# same pattern as capture_schema_accept_v1.yaml.
#
# The ONLY content difference from observation_v1.yaml is the two renamed
# entity_features labels: relative_vx/relative_vy -> entity_vx/entity_vy. Pair it
# with trainer/observation/encoder_v1_absvel.py, which writes entity.v instead of
# entity.v - player.v into channels 2,3 and leaves every other channel, clamp,
# capacity and sort key untouched.
#
# WHY: in a human_movement run player.v IS the human label one tick delayed, so
# a static object encoded a verbatim copy of the label into channel 2 (measured
# cosine 0.9857). Absolute velocity makes a static object read exactly 0 while
# KEEPING the enemy-motion information that ablating 2,3 destroyed.
#
# Scale note: channels 2,3 use normalization.entity_speed (1000.0); globals 6,7
# use the per-row player.speed stat (base 472). They do NOT share a scale, which
# is why absolute velocity is re-encoded from the raw capture rather than
# reconstructed post hoc by adding globals 6,7 back into channels 2,3.
#
# Measurement only: nothing is deployed, exported or served from this schema.

# VELOCITY-FREE ENTITY RANKING (this file only).
#
# encoder_v1 ranks each group by (-contact_risk, time_sec, closest, distance),
# and all three leading terms come from RELATIVE motion -- which for a static
# object is exactly -player.v. So the SLOT each object occupies is a function of
# player velocity: a leak carried by the PERMUTATION, invisible to any
# per-channel statistic and untouched by zeroing channels 2,3,11,12,13.
# Measured: a static per-slot probe containing NO velocity-derived channel still
# scored 0.2791 9-way agreement / 0.5130 cosine under the default ordering, and
# 0.1249 / 0.4232 once re-sorted by distance.
#
# entity_sort: distance ranks by (distance, instance_id, type_hash) instead.
# This also changes which entities survive the capacity cap (nearest-N rather
# than highest-contact-risk-N) -- a semantic change, stated not hidden.
entity_sort: distance

schema_id: combat_obs_v1
schema_version: 1.0.0
